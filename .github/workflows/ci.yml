name: Full Source Validation

on:
  pull_request:
    branches: [master]
  # Scheduled workflows load from the default branch, then validate the latest
  # dev source through the explicit checkout refs below.
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-source-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This job is the bounded source gate for every full-validation event and the
  # complete central gate for an exact beta version-only PR. The classifier is
  # loaded from the trusted base revision so a candidate cannot weaken its own
  # lane. Any classifier or source-gate failure falls back to the complete
  # validation matrix instead of granting the beta fast path.
  source-contracts:
    runs-on: ubuntu-latest
    outputs:
      beta_release_prep: ${{ steps.beta-release-prep.outcome == 'success' && steps.beta-release-prep.outputs.beta_release_prep || 'false' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - name: Detect exact beta release preparation
        id: beta-release-prep
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "${BASE_SHA}:scripts/classify-beta-release-prep.mjs" > "$RUNNER_TEMP/classify-beta-release-prep.mjs"
          node "$RUNNER_TEMP/classify-beta-release-prep.mjs" --github-output "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify CI workflow contracts
        run: pnpm test:contract:workflow

      - name: Typecheck root workspace
        run: npx tsc --noEmit
        timeout-minutes: 5

  workspace-build:
    needs: source-contracts
    if: >-
      !cancelled() &&
      (
        needs.source-contracts.result != 'success' ||
        needs.source-contracts.outputs.beta_release_prep != 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build complete workspace
        run: pnpm build

  hermetic-tests:
    needs: source-contracts
    if: >-
      !cancelled() &&
      (
        needs.source-contracts.result != 'success' ||
        needs.source-contracts.outputs.beta_release_prep != 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run hermetic monorepo suite
        run: pnpm test

  cross-platform-test:
    needs: source-contracts
    if: >-
      !cancelled() &&
      (
        needs.source-contracts.result != 'success' ||
        needs.source-contracts.outputs.beta_release_prep != 'true'
      )
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build complete workspace
        run: pnpm build
        timeout-minutes: 15

      - name: Run complete suite
        run: pnpm test
        timeout-minutes: 15

  # Boots the real `pnpm dev` stack on Windows and an Ubuntu control host. This
  # owns native process-spawn feedback that transpiled tests cannot provide.
  dev-smoke:
    needs: source-contracts
    if: >-
      !cancelled() &&
      (
        needs.source-contracts.result != 'success' ||
        needs.source-contracts.outputs.beta_release_prep != 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The native smoke needs UTA, Alice, and UI, not the Electron download.
      - run: pnpm install --frozen-lockfile --filter='!@traderalice/desktop'

      - name: Exercise Guardian recovery with real child processes
        run: pnpm test:system:guardian
        timeout-minutes: 3

      - name: Boot the complete development stack
        run: pnpm test:system:dev-stack
        timeout-minutes: 8
