name: CLI Installer Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, master, codex/usability-improvements]
    paths:
      - ".bun-version"
      - ".github/workflows/cli-installer-smoke.yml"
      - ".github/workflows/release.yml"
      - "install"
      - "package.json"
      - "packages/cli/**"
      - "scripts/install-docker-smoke.mjs"
      - "scripts/install-channel-smoke.mjs"
      - "scripts/install-channel-smoke/**"
      - "scripts/install-smoke/**"
      - "scripts/build-bun-cli-feasibility.ts"
      - "scripts/remote-ssh-smoke.mjs"
      - "scripts/remote-smoke/**"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/cli-installer-smoke.yml"
      - ".github/workflows/release.yml"
      - "install"
      - "package.json"
      - "packages/cli/**"
      - "scripts/install-channel-smoke.mjs"
      - "scripts/install-channel-smoke/**"

permissions:
  contents: read

concurrency:
  group: cli-installer-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-cli-feasibility:
    if: github.event_name != 'push'
    name: Bun CLI feasibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: pnpm install --frozen-lockfile --filter=@traderalice/openalice-cli...

      - run: pnpm build:bun-cli:feasibility

  checkout-install:
    if: github.event_name != 'push'
    name: Current checkout install
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Exercise clean HTTP installer fixture
        run: node scripts/install-docker-smoke.mjs

  checkout-remote:
    if: github.event_name != 'push'
    name: Current checkout managed remote
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Exercise clean SSH host fixture
        run: node scripts/remote-ssh-smoke.mjs --skip-tui

  dev-channel-install:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Live raw dev channel install
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Install raw dev script and dev payload in a clean host
        run: node scripts/install-channel-smoke.mjs
