name: CLI Installer Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, master, codex/usability-improvements]
    paths:
      - ".bun-version"
      - ".github/workflows/cli-installer-smoke.yml"
      - ".github/workflows/release.yml"
      - "install"
      - "package.json"
      - "packages/cli/**"
      - "packages/guardian-runtime/**"
      - "packages/uta-protocol/**"
      - "src/**"
      - "ui/**"
      - "scripts/install-docker-smoke.mjs"
      - "scripts/install-channel-smoke.mjs"
      - "scripts/install-channel-smoke/**"
      - "scripts/install-smoke/**"
      - "scripts/build-bun-cli-feasibility.ts"
      - "scripts/build-bun-alice-feasibility.ts"
      - "scripts/bun-broker-pack-fixture.ts"
      - "scripts/build-bun-runtime-feasibility.ts"
      - "scripts/build-bun-release.ts"
      - "scripts/build-cli-package-channels.mjs"
      - "scripts/build-cli-package-channels.spec.mjs"
      - "scripts/pack-cli-npm-packages.mjs"
      - "scripts/pack-cli-npm-packages.spec.mjs"
      - "scripts/cli-package-manager-smoke.mjs"
      - "scripts/cli-release-fixture.mjs"
      - "scripts/cli-release-fixture.spec.mjs"
      - "scripts/cli-system-package-manager-smoke.mjs"
      - "scripts/cli-aur-container-smoke.mjs"
      - "scripts/cli-aur-container-smoke.spec.mjs"
      - "scripts/cli-linuxbrew-smoke.mjs"
      - "scripts/cli-linuxbrew-smoke.spec.mjs"
      - "scripts/cli-legacy-cutover-smoke.mjs"
      - "scripts/cli-legacy-cutover-smoke.spec.mjs"
      - "scripts/prepare-cli-previous-release.mjs"
      - "scripts/prepare-cli-dev-assets.mjs"
      - "scripts/prepare-cli-dev-assets.spec.mjs"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/remote-ssh-smoke.mjs"
      - "scripts/remote-smoke/**"
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: cli-installer-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-cli-feasibility:
    if: github.event_name != 'push'
    name: Bun feasibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: pnpm install --frozen-lockfile --filter='!@traderalice/desktop'

      - run: pnpm build:server

      - run: pnpm build:bun-cli:feasibility

      - run: pnpm build:bun-alice:feasibility

      - run: pnpm build:bun-runtime:feasibility

      - run: pnpm build:bun:release

      - name: Accept npm and Bun installs from the current native candidate
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CONTENT_IDENTITY=$(node -p "require('./dist/bun-release/report.json').contentIdentity")
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/bun-release \
            --output-dir "$RUNNER_TEMP/cli-package-channels" \
            --version "$VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --npm-only
          node scripts/cli-package-manager-smoke.mjs \
            --manager npm \
            --packages-dir "$RUNNER_TEMP/cli-package-channels/npm" \
            --expected-version "$VERSION" \
            --expected-content-identity "$CONTENT_IDENTITY"
          node scripts/cli-package-manager-smoke.mjs \
            --manager bun \
            --packages-dir "$RUNNER_TEMP/cli-package-channels/npm" \
            --expected-version "$VERSION" \
            --expected-content-identity "$CONTENT_IDENTITY"

  checkout-install:
    if: github.event_name != 'push'
    name: Current checkout install
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Exercise clean HTTP installer fixture
        run: node scripts/install-docker-smoke.mjs

  checkout-remote:
    if: github.event_name != 'push'
    name: Current checkout managed remote
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Exercise clean SSH host fixture
        run: node scripts/remote-ssh-smoke.mjs --skip-tui

  build-dev-cli:
    if: github.event_name == 'push'
    name: Build dev native CLI (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: pnpm install --frozen-lockfile --filter='!@traderalice/desktop'

      - name: Build Alice and native CLI
        run: |
          pnpm build:server
          pnpm build:bun:release

      - name: Accept npm and Bun installs from the dev native candidate
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CONTENT_IDENTITY=$(node -p "require('./dist/bun-release/report.json').contentIdentity")
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/bun-release \
            --output-dir "$RUNNER_TEMP/cli-package-channels" \
            --version "$VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --npm-only
          node scripts/cli-package-manager-smoke.mjs \
            --manager npm \
            --packages-dir "$RUNNER_TEMP/cli-package-channels/npm" \
            --expected-version "$VERSION" \
            --expected-content-identity "$CONTENT_IDENTITY"
          node scripts/cli-package-manager-smoke.mjs \
            --manager bun \
            --packages-dir "$RUNNER_TEMP/cli-package-channels/npm" \
            --expected-version "$VERSION" \
            --expected-content-identity "$CONTENT_IDENTITY"

      - name: Name the native acceptance report
        shell: bash
        run: >-
          cp dist/bun-release/report.json
          dist/bun-release/openalice-cli-${{ matrix.platform }}-${{ matrix.arch }}.report.json

      - name: Preserve accepted dev candidate
        uses: actions/upload-artifact@v4
        with:
          name: dev-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/bun-release/*.tar.gz
            dist/bun-release/*.tar.gz.sha256
            dist/bun-release/openalice-cli-*.report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  accept-dev-linuxbrew:
    if: github.event_name == 'push'
    name: Accept dev Linuxbrew CLI (${{ matrix.arch }})
    needs: build-dev-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          pattern: dev-cli-*
          path: dist/dev-cli-candidates
          merge-multiple: true

      - name: Accept the dev archives through Linuxbrew
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/prepare-cli-previous-release.mjs \
            --input-dir dist/dev-cli-candidates \
            --output-dir dist/dev-linuxbrew-previous \
            --version "$VERSION"
          PREVIOUS_VERSION=$(node -p "require('./dist/dev-linuxbrew-previous/fixture.json').previousVersion")
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/dev-cli-candidates \
            --output-dir dist/dev-linuxbrew-current \
            --version "$VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url file:///work/dist/dev-cli-candidates \
            --require-all
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/dev-linuxbrew-previous \
            --output-dir dist/dev-linuxbrew-previous-channels \
            --version "$PREVIOUS_VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url file:///work/dist/dev-linuxbrew-previous \
            --require-all
          CURRENT_ID=$(node -e "const f=require('./dist/dev-linuxbrew-current/cli-package-channels.json');process.stdout.write(f.targets.find(t=>t.platform==='linux'&&t.arch==='${{ matrix.arch }}').contentIdentity)")
          PREVIOUS_ID=$(node -e "const f=require('./dist/dev-linuxbrew-previous/fixture.json');process.stdout.write(f.targets.find(t=>t.platform==='linux'&&t.arch==='${{ matrix.arch }}').previousContentIdentity)")
          node scripts/cli-linuxbrew-smoke.mjs \
            --arch "${{ matrix.arch }}" \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$VERSION" \
            --previous-content-identity "$PREVIOUS_ID" \
            --current-content-identity "$CURRENT_ID" \
            --previous-package dist/dev-linuxbrew-previous-channels/homebrew/openalice.rb \
            --current-package dist/dev-linuxbrew-current/homebrew/openalice.rb

  accept-dev-aur:
    if: github.event_name == 'push'
    name: Accept dev Arch/AUR CLI (${{ matrix.arch }})
    needs: build-dev-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          pattern: dev-cli-*
          path: dist/dev-cli-candidates
          merge-multiple: true

      - name: Accept the dev archives through Arch/AUR
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/prepare-cli-previous-release.mjs \
            --input-dir dist/dev-cli-candidates \
            --output-dir dist/dev-aur-previous \
            --version "$VERSION"
          PREVIOUS_VERSION=$(node -p "require('./dist/dev-aur-previous/fixture.json').previousVersion")
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/dev-cli-candidates \
            --output-dir dist/dev-aur-current \
            --version "$VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url file:///work/dist/dev-cli-candidates \
            --require-all
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/dev-aur-previous \
            --output-dir dist/dev-aur-previous-channels \
            --version "$PREVIOUS_VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url file:///work/dist/dev-aur-previous \
            --require-all
          CURRENT_ID=$(node -e "const f=require('./dist/dev-aur-current/cli-package-channels.json');process.stdout.write(f.targets.find(t=>t.platform==='linux'&&t.arch==='${{ matrix.arch }}').contentIdentity)")
          PREVIOUS_ID=$(node -e "const f=require('./dist/dev-aur-previous/fixture.json');process.stdout.write(f.targets.find(t=>t.platform==='linux'&&t.arch==='${{ matrix.arch }}').previousContentIdentity)")
          node scripts/cli-aur-container-smoke.mjs \
            --arch "${{ matrix.arch }}" \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$VERSION" \
            --previous-content-identity "$PREVIOUS_ID" \
            --current-content-identity "$CURRENT_ID" \
            --previous-package dist/dev-aur-previous-channels/aur/PKGBUILD \
            --current-package dist/dev-aur-current/aur/PKGBUILD

  accept-dev-legacy-cutover:
    if: github.event_name == 'push'
    name: Accept published v0.90.1 CLI cutover
    needs: build-dev-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          name: dev-cli-linux-x64
          path: dist/dev-cli-linux-x64

      - name: Replace the published legacy CLI with the accepted native candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE=$(find dist/dev-cli-linux-x64 -maxdepth 1 -name '*.tar.gz' -print -quit)
          SHA256=$(awk 'NR == 1 { print $1 }' "$ARCHIVE.sha256")
          CONTENT_IDENTITY=$(node -e "const fs=require('fs');const p=fs.readdirSync('dist/dev-cli-linux-x64').find(v=>v.endsWith('.report.json'));process.stdout.write(require('./dist/dev-cli-linux-x64/'+p).contentIdentity)")
          node scripts/cli-legacy-cutover-smoke.mjs \
            --archive "$ARCHIVE" \
            --sha256 "$SHA256" \
            --expected-version "$VERSION" \
            --expected-content-identity "$CONTENT_IDENTITY"

  publish-dev-cli:
    if: github.event_name == 'push'
    name: Publish dev native CLI aliases
    needs: [build-dev-cli, accept-dev-linuxbrew, accept-dev-aur, accept-dev-legacy-cutover]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          pattern: dev-cli-*
          path: dist/dev-cli-candidates
          merge-multiple: true

      - name: Validate candidates and prepare channel aliases
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/prepare-cli-dev-assets.mjs \
            --input-dir dist/dev-cli-candidates \
            --output-dir dist/dev-cli-upload \
            --commit "$GITHUB_SHA" \
            --version "$VERSION"

      - name: Install AWS CLI
        run: |
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish immutable candidates and activate dev aliases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "dist/dev-cli-upload/releases/${GITHUB_SHA}" \
            "s3://${R2_BUCKET}/cli/dev/releases/${GITHUB_SHA}/" \
            --recursive \
            --cache-control "public, max-age=31536000, immutable" \
            --endpoint-url "$ENDPOINT"

          for archive in dist/dev-cli-upload/aliases/*.tar.gz; do
            aws s3 cp "$archive" "s3://${R2_BUCKET}/cli/dev/$(basename "$archive")" \
              --cache-control "no-cache" \
              --content-type "application/gzip" \
              --endpoint-url "$ENDPOINT"
          done

          for checksum in dist/dev-cli-upload/aliases/*.sha256; do
            aws s3 cp "$checksum" "s3://${R2_BUCKET}/cli/dev/$(basename "$checksum")" \
              --cache-control "no-cache" \
              --content-type "text/plain" \
              --endpoint-url "$ENDPOINT"
          done

          aws s3 cp dist/dev-cli-upload/manifest.json "s3://${R2_BUCKET}/cli/dev/manifest.json" \
            --cache-control "no-cache" \
            --content-type "application/json" \
            --endpoint-url "$ENDPOINT"

  dev-channel-install:
    if: always() && ((github.event_name == 'push' && needs.publish-dev-cli.result == 'success') || github.event_name == 'workflow_dispatch')
    name: Live raw dev channel install
    needs: publish-dev-cli
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Install raw dev script and dev payload in a clean host
        run: node scripts/install-channel-smoke.mjs
