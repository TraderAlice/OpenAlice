name: Dev PR Clean Build

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-pr-clean-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify CI workflow contracts
        run: pnpm test:contract:workflow

      - name: Verify required local product and protocol evidence
        run: pnpm test:critical --receipt artifacts/tests/critical-local.json

      - name: Upload required evidence receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: critical-local-receipt
          path: artifacts/tests/critical-local.json
          if-no-files-found: error

      - name: Build complete workspace
        run: pnpm build

      - name: Typecheck registered suites
        run: pnpm exec tsc -p tests/tsconfig.json --noEmit
