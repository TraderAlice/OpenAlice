name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a release or repair mirrors for a channel-aware release made by this workflow.
        required: true
        default: release
        type: choice
        options:
          - release
          - mirror
      tag:
        description: Release tag, for example v0.91.0 or v0.91.0-beta.1.
        required: true
        type: string
      channel:
        description: Mutable release channel that this tag is allowed to update.
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

concurrency:
  group: openalice-release-publication
  cancel-in-progress: false

jobs:
  release:
    name: Plan release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Whether this dispatch requests a new release. The tag/package version
      # contract is validated before any expensive candidate jobs begin.
      # The tag and GitHub Release are deliberately created only after every
      # platform builds and passes Workspace acceptance.
      created: ${{ steps.plan.outputs.created }}
      operation: ${{ steps.plan.outputs.operation }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for git-cliff

      - name: Validate release intent and version authority
        id: plan
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$OPERATION" != "release" ] && [ "$OPERATION" != "mirror" ]; then
            echo "Operation must be release or mirror, got: $OPERATION" >&2
            exit 1
          fi
          if [ "$SOURCE_REF" != "refs/heads/master" ]; then
            echo "Release operations must be dispatched from master, got: $SOURCE_REF" >&2
            exit 1
          fi

          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
            PREVIOUS_TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
          elif [ "$RELEASE_CHANNEL" = "beta" ]; then
            TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+-beta(\.[1-9][0-9]*)?$'
            PREVIOUS_TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+-beta(\.[1-9][0-9]*)?$'
          else
            echo "Release channel must be beta or stable, got: $RELEASE_CHANNEL" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ $TAG_PATTERN ]]; then
            echo "Release tag $RELEASE_TAG does not match channel $RELEASE_CHANNEL" >&2
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          if [ "$OPERATION" = "release" ]; then
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
            if [ "$PACKAGE_VERSION" != "$VERSION" ] || [ "$CLI_VERSION" != "$VERSION" ]; then
              echo "Release tag $RELEASE_TAG requires package versions $VERSION; root=$PACKAGE_VERSION cli=$CLI_VERSION" >&2
              exit 1
            fi

            if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release tag already exists: $RELEASE_TAG" >&2
              exit 1
            fi
            CREATED=true
          else
            if ! git rev-parse "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
              echo "Mirror repair requires an existing release tag: $RELEASE_TAG" >&2
              exit 1
            fi
            CREATED=false
          fi

          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
          PREVIOUS_TAG=$(
            git for-each-ref --merged="$SOURCE_SHA" --sort=-version:refname \
              --format='%(refname:short)' refs/tags \
              | grep -E "$PREVIOUS_TAG_PATTERN" \
              | head -n 1 \
              || true
          )
          if [ "$OPERATION" = "release" ] && [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous $RELEASE_CHANNEL release tag is reachable from $SOURCE_SHA" >&2
            exit 1
          fi
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install git-cliff
        if: steps.plan.outputs.created == 'true'
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate release notes
        if: steps.plan.outputs.created == 'true'
        id: notes
        run: |
          # Generate notes for this version only (since last tag).
          # --tag labels the about-to-be-created version: git-cliff runs
          # BEFORE the tag exists (it's created only after candidate acceptance), so without
          # this the section header falls back to "[Unreleased]" instead of
          # the version. See cliff.toml's `{% if version %}` template.
          TAG="${{ steps.plan.outputs.tag }}"
          LAST_TAG="${{ steps.plan.outputs.previous_tag }}"
          if [ -z "$LAST_TAG" ]; then
            git-cliff --tag "$TAG" --output notes.md
          else
            git-cliff "$LAST_TAG"..HEAD --tag "$TAG" --output notes.md
          fi

      - name: Preserve release notes for gated publication
        if: steps.plan.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  preflight-public-cli-authority:
    name: Preflight public CLI channel authority
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Verify every opted-in public channel before release publication
        if: needs.release.outputs.channel == 'stable'
        run: node scripts/preflight-public-cli-authority.mjs
        env:
          OPENALICE_PUBLISH_NPM: ${{ vars.OPENALICE_PUBLISH_NPM }}
          OPENALICE_PUBLISH_HOMEBREW: ${{ vars.OPENALICE_PUBLISH_HOMEBREW }}
          OPENALICE_PUBLISH_AUR: ${{ vars.OPENALICE_PUBLISH_AUR }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}

  # Per-platform desktop installers are built before any tag or GitHub Release
  # exists. Each runner builds only its own platform/arch, preserves the candidate
  # immediately after fast package acceptance, and leaves the slower N-1 upgrade
  # journey to a downstream job that can be retried without rebuilding it. macOS
  # builds are signed and notarized through Developer ID secrets; Windows remains
  # unsigned until a Windows code-signing certificate exists.
  build-desktop:
    needs: [release, preflight-public-cli-authority]
    if: needs.release.outputs.created == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # macOS still uses dugite's embedded Git. Windows keeps only dugite's JS
      # wrapper and routes it to managed PortableGit in the packaged smoke.
      - name: Verify bundled git (dugite) was fetched
        if: runner.os == 'macOS'
        run: |
          node -e "const{existsSync}=require('fs');const{dirname,join}=require('path');const g=join(dirname(require.resolve('dugite/package.json')),'git');if(!existsSync(g)){console.error('dugite embedded git MISSING at '+g);process.exit(1)}console.log('dugite embedded git OK '+g)"

      - name: Build Alice + UTA + desktop shell
        run: pnpm electron:build

      - name: Vendor managed workspace runtime
        run: pnpm vendor:runtime

      - name: Write Apple notarization API key
        if: runner.os == 'macOS'
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Package macOS installer
        if: runner.os == 'macOS'
        # Build on the matching native host so pnpm and electron-builder both
        # select the correct native dependencies for arm64 or Intel.
        run: |
          ulimit -n 65536 || ulimit -n 32768 || ulimit -n 16384 || ulimit -n 10240
          echo "open files limit: $(ulimit -n)"
          pnpm -F @traderalice/desktop exec electron-builder --projectDir ../.. --publish never --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        # Windows remains unsigned until a Windows code-signing certificate is
        # available.
        run: pnpm -F @traderalice/desktop exec electron-builder --projectDir ../.. --publish never --${{ matrix.arch }}

      - name: Prove release candidate Workspace CLI acceptance
        run: pnpm electron:smoke:workspace --skip-build --skip-pack
        timeout-minutes: 5
        env:
          OPENALICE_SMOKE_RECEIPT_PATH: ${{ runner.temp }}/openalice-workspace-acceptance.json

      - name: Preserve release acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ runner.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/openalice-workspace-acceptance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare update channel aliases
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ runner.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/prepare-desktop-release-assets.mjs build \
            --out-dir dist/electron-app \
            --platform "$RELEASE_PLATFORM" \
            --arch "$RELEASE_ARCH" \
            --version "$VERSION"
          rm -f dist/electron-app/builder-debug.yml

      - name: Verify candidate update metadata and referenced bytes
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ runner.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          pnpm electron:verify-update-assets -- \
            --out-dir dist/electron-app \
            --platform "$RELEASE_PLATFORM" \
            --arch "$RELEASE_ARCH" \
            --version "$VERSION"

      - name: Preserve desktop release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/electron-app/*.dmg
            dist/electron-app/*.zip
            dist/electron-app/*.yml
            dist/electron-app/*.blockmap
            dist/electron-app/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The final-artifact upgrade journey is intentionally downstream from the
  # build. A failed platform can be retried from its preserved installer without
  # repeating Electron packaging, macOS signing, or notarization.
  accept-desktop-upgrade:
    name: Accept desktop upgrade (${{ matrix.os }}, ${{ matrix.arch }})
    needs: [release, build-desktop]
    if: needs.release.outputs.created == 'true' && needs.build-desktop.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore desktop release candidate
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          path: dist/electron-app

      - name: Prove final desktop artifact upgrades previous release state
        run: >-
          pnpm electron:smoke:upgrade --
          --from "${{ needs.release.outputs.previous_tag }}"
          --candidate-artifact-dir dist/electron-app
          --receipt "${{ runner.temp }}/openalice-desktop-upgrade.json"
        timeout-minutes: 30

      - name: Preserve desktop upgrade acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-upgrade-acceptance-${{ runner.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/openalice-desktop-upgrade.json
          if-no-files-found: error
          retention-days: 7

  cli-installer-acceptance:
    name: Accept CLI installer candidate
    needs: [release, preflight-public-cli-authority]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @traderalice/openalice-cli

      - name: Exercise candidate installer in a clean HTTP fixture
        run: node scripts/install-docker-smoke.mjs

      - name: Exercise candidate installer through managed SSH remote
        run: node scripts/remote-ssh-smoke.mjs --skip-tui

  build-cli-installer:
    name: Build channel-neutral CLI installer snapshot
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Freeze and verify the accepted installer bytes
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/cli-installer
          installer="OpenAlice-${VERSION}-install"
          cp install "dist/cli-installer/${installer}"
          bash -n "dist/cli-installer/${installer}"
          (cd dist/cli-installer && sha256sum "$installer" > "${installer}.sha256")

      - name: Preserve immutable installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: cli-installer
          path: |
            dist/cli-installer/OpenAlice-*-install
            dist/cli-installer/OpenAlice-*-install.sha256
          if-no-files-found: error
          retention-days: 1

  build-cli-release:
    name: Build native CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [release, preflight-public-cli-authority]
    if: needs.release.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter='!@traderalice/desktop'

      - name: Build Alice and native CLI
        run: |
          pnpm build:server
          pnpm build:bun-runtime:feasibility
          pnpm build:bun:release

      - name: Install and boot the native candidate outside the checkout
        shell: bash
        run: |
          archive=$(find dist/bun-release -maxdepth 1 -name 'openalice-cli-*.tar.gz' -print -quit)
          test -n "$archive"
          sha256=$(cut -d ' ' -f 1 "${archive}.sha256")
          ./install \
            --archive "$GITHUB_WORKSPACE/$archive" \
            --sha256 "$sha256" \
            --install-dir "$RUNNER_TEMP/openalice-cli" \
            --no-modify-path \
            --yes
          "$RUNNER_TEMP/openalice-cli/bin/openalice" up \
            --home "$RUNNER_TEMP/openalice-home" \
            --no-update-check \
            --wait 120 \
            --json
          "$RUNNER_TEMP/openalice-cli/bin/openalice" doctor \
            --home "$RUNNER_TEMP/openalice-home" \
            --json
          "$RUNNER_TEMP/openalice-cli/bin/openalice" down \
            --home "$RUNNER_TEMP/openalice-home" \
            --json

      - name: Accept npm and Bun installs from the native candidate
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CONTENT_IDENTITY=$(node -p "require('./dist/bun-release/report.json').contentIdentity")
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/bun-release \
            --output-dir "$RUNNER_TEMP/cli-package-channels" \
            --version "$VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --npm-only
          node scripts/cli-package-manager-smoke.mjs \
            --manager npm \
            --packages-dir "$RUNNER_TEMP/cli-package-channels/npm" \
            --expected-version "$VERSION" \
            --expected-content-identity "$CONTENT_IDENTITY"
          node scripts/cli-package-manager-smoke.mjs \
            --manager bun \
            --packages-dir "$RUNNER_TEMP/cli-package-channels/npm" \
            --expected-version "$VERSION" \
            --expected-content-identity "$CONTENT_IDENTITY"

      - name: Name the native acceptance report
        shell: bash
        run: >-
          cp dist/bun-release/report.json
          dist/bun-release/openalice-cli-${{ matrix.platform }}-${{ matrix.arch }}.report.json

      - name: Preserve accepted native CLI
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/bun-release/*.tar.gz
            dist/bun-release/*.tar.gz.sha256
            dist/bun-release/openalice-cli-*.report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-cli-package-channels:
    name: Build CLI package-manager channels
    needs: [release, build-cli-release]
    if: needs.release.outputs.created == 'true' && needs.release.outputs.channel == 'stable' && needs.build-cli-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-release-*
          path: dist/release-cli
          merge-multiple: true

      - name: Derive package-manager metadata from accepted archives
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/release-cli \
            --output-dir dist/cli-package-channels \
            --version "$VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --require-all
          node scripts/pack-cli-npm-packages.mjs \
            --input-dir dist/cli-package-channels/npm \
            --output-dir dist/cli-npm-tarballs

      - name: Preserve package-manager publication inputs
        uses: actions/upload-artifact@v4
        with:
          name: cli-package-channels
          path: |
            dist/cli-package-channels/cli-package-channels.json
            dist/cli-package-channels/homebrew/openalice.rb
            dist/cli-package-channels/aur/PKGBUILD
            dist/cli-package-channels/aur/.SRCINFO
            dist/cli-npm-tarballs/*.tgz
            dist/cli-npm-tarballs/npm-publish-order.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  accept-cli-homebrew:
    name: Accept Homebrew CLI (${{ matrix.arch }})
    needs: [release, build-cli-release]
    if: needs.release.outputs.created == 'true' && needs.release.outputs.channel == 'stable' && needs.build-cli-release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-release-*
          path: dist/release-cli
          merge-multiple: true

      - name: Install and run the accepted archive through Homebrew
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          CURRENT_ASSET_BASE_URL=$(node -e "const{pathToFileURL}=require('url');const{resolve}=require('path');process.stdout.write(pathToFileURL(resolve('dist/release-cli')).href)")
          node scripts/prepare-cli-previous-release.mjs \
            --input-dir dist/release-cli \
            --output-dir dist/cli-package-homebrew-previous \
            --version "$VERSION"
          PREVIOUS_VERSION=$(node -p "require('./dist/cli-package-homebrew-previous/fixture.json').previousVersion")
          PREVIOUS_ASSET_BASE_URL=$(node -e "const{pathToFileURL}=require('url');const{resolve}=require('path');process.stdout.write(pathToFileURL(resolve('dist/cli-package-homebrew-previous')).href)")
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/release-cli \
            --output-dir dist/cli-package-homebrew-current \
            --version "$VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url "$CURRENT_ASSET_BASE_URL" \
            --require-all
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/cli-package-homebrew-previous \
            --output-dir dist/cli-package-homebrew-previous-channels \
            --version "$PREVIOUS_VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url "$PREVIOUS_ASSET_BASE_URL" \
            --require-all
          CURRENT_ID=$(node -e "const f=require('./dist/cli-package-homebrew-current/cli-package-channels.json');process.stdout.write(f.targets.find(t=>t.platform==='darwin'&&t.arch==='${{ matrix.arch }}').contentIdentity)")
          PREVIOUS_ID=$(node -e "const f=require('./dist/cli-package-homebrew-previous/fixture.json');process.stdout.write(f.targets.find(t=>t.platform==='darwin'&&t.arch==='${{ matrix.arch }}').previousContentIdentity)")
          node scripts/cli-system-package-manager-smoke.mjs \
            --manager brew \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$VERSION" \
            --previous-content-identity "$PREVIOUS_ID" \
            --current-content-identity "$CURRENT_ID" \
            --previous-package dist/cli-package-homebrew-previous-channels/homebrew/openalice.rb \
            --current-package dist/cli-package-homebrew-current/homebrew/openalice.rb

  accept-cli-linuxbrew:
    name: Accept Linuxbrew CLI (${{ matrix.arch }})
    needs: [release, build-cli-release]
    if: needs.release.outputs.created == 'true' && needs.release.outputs.channel == 'stable' && needs.build-cli-release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-release-*
          path: dist/release-cli
          merge-multiple: true

      - name: Install and run the accepted archive through Linuxbrew
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/prepare-cli-previous-release.mjs \
            --input-dir dist/release-cli \
            --output-dir dist/cli-package-linuxbrew-previous \
            --version "$VERSION"
          PREVIOUS_VERSION=$(node -p "require('./dist/cli-package-linuxbrew-previous/fixture.json').previousVersion")
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/release-cli \
            --output-dir dist/cli-package-linuxbrew-current \
            --version "$VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url file:///work/dist/release-cli \
            --require-all
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/cli-package-linuxbrew-previous \
            --output-dir dist/cli-package-linuxbrew-previous-channels \
            --version "$PREVIOUS_VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url file:///work/dist/cli-package-linuxbrew-previous \
            --require-all
          CURRENT_ID=$(node -e "const f=require('./dist/cli-package-linuxbrew-current/cli-package-channels.json');process.stdout.write(f.targets.find(t=>t.platform==='linux'&&t.arch==='${{ matrix.arch }}').contentIdentity)")
          PREVIOUS_ID=$(node -e "const f=require('./dist/cli-package-linuxbrew-previous/fixture.json');process.stdout.write(f.targets.find(t=>t.platform==='linux'&&t.arch==='${{ matrix.arch }}').previousContentIdentity)")
          node scripts/cli-linuxbrew-smoke.mjs \
            --arch "${{ matrix.arch }}" \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$VERSION" \
            --previous-content-identity "$PREVIOUS_ID" \
            --current-content-identity "$CURRENT_ID" \
            --previous-package dist/cli-package-linuxbrew-previous-channels/homebrew/openalice.rb \
            --current-package dist/cli-package-linuxbrew-current/homebrew/openalice.rb

  accept-cli-aur:
    name: Accept Arch/AUR CLI package (${{ matrix.arch }})
    needs: [release, build-cli-release]
    if: needs.release.outputs.created == 'true' && needs.release.outputs.channel == 'stable' && needs.build-cli-release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-release-*
          path: dist/release-cli
          merge-multiple: true

      - name: Build, install, and run the generated AUR package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/prepare-cli-previous-release.mjs \
            --input-dir dist/release-cli \
            --output-dir dist/cli-package-aur-previous \
            --version "$VERSION"
          PREVIOUS_VERSION=$(node -p "require('./dist/cli-package-aur-previous/fixture.json').previousVersion")
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/release-cli \
            --output-dir dist/cli-package-aur-current \
            --version "$VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url file:///work/dist/release-cli \
            --require-all
          node scripts/build-cli-package-channels.mjs \
            --input-dir dist/cli-package-aur-previous \
            --output-dir dist/cli-package-aur-previous-channels \
            --version "$PREVIOUS_VERSION" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --asset-base-url file:///work/dist/cli-package-aur-previous \
            --require-all
          CURRENT_ID=$(node -e "const f=require('./dist/cli-package-aur-current/cli-package-channels.json');process.stdout.write(f.targets.find(t=>t.platform==='linux'&&t.arch==='${{ matrix.arch }}').contentIdentity)")
          PREVIOUS_ID=$(node -e "const f=require('./dist/cli-package-aur-previous/fixture.json');process.stdout.write(f.targets.find(t=>t.platform==='linux'&&t.arch==='${{ matrix.arch }}').previousContentIdentity)")
          node scripts/cli-aur-container-smoke.mjs \
            --arch "${{ matrix.arch }}" \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$VERSION" \
            --previous-content-identity "$PREVIOUS_ID" \
            --current-content-identity "$CURRENT_ID" \
            --previous-package dist/cli-package-aur-previous-channels/aur/PKGBUILD \
            --current-package dist/cli-package-aur-current/aur/PKGBUILD

  accept-cli-legacy-cutover:
    name: Accept published v0.90.1 CLI cutover
    needs: [release, build-cli-release]
    if: needs.release.outputs.created == 'true' && needs.build-cli-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          name: cli-release-linux-x64
          path: dist/release-cli-linux-x64

      - name: Replace the published legacy CLI with the accepted native candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE=$(find dist/release-cli-linux-x64 -maxdepth 1 -name '*.tar.gz' -print -quit)
          SHA256=$(awk 'NR == 1 { print $1 }' "$ARCHIVE.sha256")
          CONTENT_IDENTITY=$(node -e "const fs=require('fs');const p=fs.readdirSync('dist/release-cli-linux-x64').find(v=>v.endsWith('.report.json'));process.stdout.write(require('./dist/release-cli-linux-x64/'+p).contentIdentity)")
          node scripts/cli-legacy-cutover-smoke.mjs \
            --archive "$ARCHIVE" \
            --sha256 "$SHA256" \
            --expected-version "$VERSION" \
            --expected-content-identity "$CONTENT_IDENTITY" \
            --channel "${{ needs.release.outputs.channel }}"

  # Broker Packs are release artifacts, not inputs to the desktop package. Build
  # and validate them on their native platforms in parallel with desktop and
  # native CLI candidates instead of serializing them in desktop jobs.
  build-broker-packs:
    name: Build Broker Packs (${{ matrix.os }}, ${{ matrix.arch }})
    needs: [release, preflight-public-cli-authority]
    if: needs.release.outputs.created == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build optional Broker Packs
        run: pnpm broker-packs:build

      - name: Prove previous-release Broker Pack upgrade
        run: pnpm broker-packs:upgrade-smoke -- --from "${{ needs.release.outputs.previous_tag }}"

      - name: Preserve Broker Packs
        uses: actions/upload-artifact@v4
        with:
          name: broker-packs-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/broker-packs/*.json
            dist/broker-packs/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-release:
    name: Publish accepted release
    needs: [release, preflight-public-cli-authority, build-desktop, accept-desktop-upgrade, build-cli-installer, build-cli-release, build-cli-package-channels, accept-cli-homebrew, accept-cli-linuxbrew, accept-cli-aur, accept-cli-legacy-cutover, build-broker-packs, cli-installer-acceptance]
    if: >-
      always() &&
      needs.release.outputs.created == 'true' &&
      needs.preflight-public-cli-authority.result == 'success' &&
      needs.build-desktop.result == 'success' &&
      needs.accept-desktop-upgrade.result == 'success' &&
      needs.build-cli-installer.result == 'success' &&
      needs.build-cli-release.result == 'success' &&
      needs.accept-cli-legacy-cutover.result == 'success' &&
      needs.build-broker-packs.result == 'success' &&
      needs.cli-installer-acceptance.result == 'success' &&
      (
        needs.release.outputs.channel == 'beta' ||
        (
          needs.release.outputs.channel == 'stable' &&
          needs.build-cli-package-channels.result == 'success' &&
          needs.accept-cli-homebrew.result == 'success' &&
          needs.accept-cli-linuxbrew.result == 'success' &&
          needs.accept-cli-aur.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist/release-notes

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist/release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: broker-packs-*
          path: dist/release-broker-packs
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-release-*
          path: dist/release-cli
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: cli-installer
          path: dist/release-cli-installer

      - uses: actions/download-artifact@v4
        if: needs.release.outputs.channel == 'stable'
        with:
          name: cli-package-channels
          path: dist/release-cli-packages

      - name: Stage GitHub-safe AUR metadata asset
        if: needs.release.outputs.channel == 'stable'
        run: >-
          cp
          dist/release-cli-packages/cli-package-channels/aur/.SRCINFO
          dist/release-cli-packages/cli-package-channels/aur/openalice-bin.SRCINFO

      - name: Create beta tag and GitHub prerelease from accepted candidates
        if: needs.release.outputs.channel == 'beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          body_path: dist/release-notes/notes.md
          prerelease: true
          generate_release_notes: false
          target_commitish: ${{ needs.release.outputs.source_sha }}
          fail_on_unmatched_files: true
          files: |
            dist/release-assets/*.dmg
            dist/release-assets/*.zip
            dist/release-assets/*.yml
            dist/release-assets/*.blockmap
            dist/release-assets/*.exe
            dist/release-broker-packs/*.json
            dist/release-broker-packs/*.tgz
            dist/release-cli/*.tar.gz
            dist/release-cli/*.tar.gz.sha256
            dist/release-cli-installer/OpenAlice-*-install
            dist/release-cli-installer/OpenAlice-*-install.sha256

      - name: Create stable tag and GitHub Release from accepted candidates
        if: needs.release.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          body_path: dist/release-notes/notes.md
          prerelease: false
          generate_release_notes: false
          target_commitish: ${{ needs.release.outputs.source_sha }}
          fail_on_unmatched_files: true
          files: |
            dist/release-assets/*.dmg
            dist/release-assets/*.zip
            dist/release-assets/*.yml
            dist/release-assets/*.blockmap
            dist/release-assets/*.exe
            dist/release-broker-packs/*.json
            dist/release-broker-packs/*.tgz
            dist/release-cli/*.tar.gz
            dist/release-cli/*.tar.gz.sha256
            dist/release-cli-installer/OpenAlice-*-install
            dist/release-cli-installer/OpenAlice-*-install.sha256
            dist/release-cli-packages/cli-package-channels/cli-package-channels.json
            dist/release-cli-packages/cli-package-channels/homebrew/openalice.rb
            dist/release-cli-packages/cli-package-channels/aur/PKGBUILD
            dist/release-cli-packages/cli-package-channels/aur/openalice-bin.SRCINFO
            dist/release-cli-packages/cli-npm-tarballs/*.tgz
            dist/release-cli-packages/cli-npm-tarballs/npm-publish-order.json

  publish-cli-npm:
    name: Publish npm CLI packages
    needs: [release, publish-release, build-cli-package-channels, verify-public-cli-channels]
    if: needs.release.outputs.channel == 'stable' && needs.verify-public-cli-channels.result == 'success' && vars.OPENALICE_PUBLISH_NPM == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: cli-package-channels
          path: dist/cli-package-channels

      - name: Publish platform packages before the meta package
        working-directory: dist/cli-package-channels/cli-npm-tarballs
        run: |
          set -euo pipefail
          node -e 'const m=require("./npm-publish-order.json");for(const p of m.packages.slice(0,-1))console.log(p.filename)' |
            while IFS= read -r package; do npm publish "$package" --access public --provenance; done
          META=$(node -e 'const m=require("./npm-publish-order.json");process.stdout.write(m.packages.at(-1).filename)')
          npm publish "$META" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-public-cli-channels:
    name: Verify public CLI channel assets
    needs: [release, publish-release, build-cli-package-channels, mirror-release-assets]
    if: needs.release.outputs.channel == 'stable' && needs.publish-release.result == 'success' && needs.mirror-release-assets.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - uses: actions/download-artifact@v4
        with:
          name: cli-package-channels
          path: dist/cli-package-channels

      - name: Verify accepted archives are publicly readable and unchanged
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: >-
          node scripts/verify-public-cli-channels.mjs
          --manifest dist/cli-package-channels/cli-package-channels/cli-package-channels.json
          --version "$VERSION"
          > dist/cli-package-channels/public-channel-receipt.json

      - name: Compare public metadata with the accepted publication inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p dist/public-cli-channels
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir dist/public-cli-channels \
            --pattern cli-package-channels.json \
            --pattern openalice.rb \
            --pattern PKGBUILD \
            --pattern openalice-bin.SRCINFO \
            --pattern npm-publish-order.json
          cmp dist/cli-package-channels/cli-package-channels/cli-package-channels.json dist/public-cli-channels/cli-package-channels.json
          cmp dist/cli-package-channels/cli-package-channels/homebrew/openalice.rb dist/public-cli-channels/openalice.rb
          cmp dist/cli-package-channels/cli-package-channels/aur/PKGBUILD dist/public-cli-channels/PKGBUILD
          cmp dist/cli-package-channels/cli-package-channels/aur/.SRCINFO dist/public-cli-channels/openalice-bin.SRCINFO
          cmp dist/cli-package-channels/cli-npm-tarballs/npm-publish-order.json dist/public-cli-channels/npm-publish-order.json

      - name: Preserve public channel verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: public-cli-channel-receipt
          path: dist/cli-package-channels/public-channel-receipt.json
          if-no-files-found: error
          retention-days: 30

  publish-cli-homebrew:
    name: Publish Homebrew tap formula
    needs: [release, verify-public-cli-channels, build-cli-package-channels]
    if: needs.release.outputs.channel == 'stable' && needs.verify-public-cli-channels.result == 'success' && vars.OPENALICE_PUBLISH_HOMEBREW == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-package-channels
          path: dist/cli-package-channels

      - uses: actions/checkout@v7
        with:
          repository: TraderAlice/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          fetch-depth: 0

      - name: Activate the verified formula in the TraderAlice tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          install -Dm644 dist/cli-package-channels/cli-package-channels/homebrew/openalice.rb tap/Formula/openalice.rb
          cd tap
          git config user.name OpenAlice Release Bot
          git config user.email release-bot@openalice.ai
          git add Formula/openalice.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already publishes OpenAlice ${VERSION}."
            exit 0
          fi
          git commit -m "openalice ${VERSION}"
          git push

  publish-cli-aur:
    name: Publish AUR package metadata
    needs: [release, verify-public-cli-channels, build-cli-package-channels]
    if: needs.release.outputs.channel == 'stable' && needs.verify-public-cli-channels.result == 'success' && vars.OPENALICE_PUBLISH_AUR == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-package-channels
          path: dist/cli-package-channels

      - name: Check out the AUR package repository
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          test -n "$AUR_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$AUR_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          git clone ssh://aur@aur.archlinux.org/openalice-bin.git aur

      - name: Activate the verified package metadata in AUR
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          install -Dm644 dist/cli-package-channels/cli-package-channels/aur/PKGBUILD aur/PKGBUILD
          install -Dm644 dist/cli-package-channels/cli-package-channels/aur/.SRCINFO aur/.SRCINFO
          cd aur
          git config user.name OpenAlice Release Bot
          git config user.email release-bot@openalice.ai
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR metadata already publishes OpenAlice ${VERSION}."
            exit 0
          fi
          git commit -m "openalice-bin ${VERSION}"
          git push

  mirror-release-assets:
    needs: [release, publish-release]
    if: always() && ((needs.release.outputs.created == 'true' && needs.publish-release.result == 'success') || needs.release.outputs.operation == 'mirror')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p dist/r2-upload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist/r2-upload --clobber

      - name: Verify release-owned CLI installer
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          installer="OpenAlice-${VERSION}-install"
          if [ ! -f "dist/r2-upload/${installer}" ] || [ ! -f "dist/r2-upload/${installer}.sha256" ]; then
            echo "Mirror repair requires a channel-aware Release with its immutable installer and checksum sidecar: ${TAG}" >&2
            exit 1
          fi
          bash -n "dist/r2-upload/${installer}"
          (cd dist/r2-upload && sha256sum -c "${installer}.sha256")

      - name: Prepare CDN download aliases
        env:
          TAG: ${{ needs.release.outputs.tag }}
          DOWNLOAD_BASE_URL: ${{ secrets.DOWNLOAD_BASE_URL }}
        run: |
          node scripts/prepare-desktop-release-assets.mjs mirror \
            --out-dir dist/r2-upload \
            --tag "$TAG" \
            --base-url "${DOWNLOAD_BASE_URL:-https://download.openalice.ai}" \
            --repository "$GITHUB_REPOSITORY"

      - name: Install AWS CLI
        run: |
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Keep mirror repair on the active channel release
        if: needs.release.outputs.operation == 'mirror'
        env:
          DOWNLOAD_BASE_URL: ${{ secrets.DOWNLOAD_BASE_URL }}
          RELEASE_CHANNEL: ${{ needs.release.outputs.channel }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          BASE_URL="${DOWNLOAD_BASE_URL:-https://download.openalice.ai}"
          BASE_URL="${BASE_URL%/}"
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            MANIFEST_PATH="manifest.json"
          else
            MANIFEST_PATH="beta/manifest.json"
          fi
          curl -fsSL "${BASE_URL}/${MANIFEST_PATH}" -o /tmp/openalice-active-channel.json
          CHANNEL="$RELEASE_CHANNEL" VERSION="$VERSION" node -e '
            const value = require("/tmp/openalice-active-channel.json");
            if (value.version !== process.env.VERSION) process.exit(1);
            if (value.channel !== undefined && value.channel !== process.env.CHANNEL) process.exit(1);
          '

      - name: Snapshot stable aliases before a beta mirror
        if: needs.release.outputs.channel == 'beta'
        env:
          DOWNLOAD_BASE_URL: ${{ secrets.DOWNLOAD_BASE_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${DOWNLOAD_BASE_URL:-https://download.openalice.ai}"
          BASE_URL="${BASE_URL%/}"
          mkdir -p /tmp/openalice-stable-before
          for name in manifest.json latest-mac.yml latest-mac-arm64.yml latest-mac-intel.yml latest-intel-mac.yml latest.yml; do
            curl -fsSL "${BASE_URL}/${name}" -o "/tmp/openalice-stable-before/${name//\//_}"
          done
          (cd /tmp/openalice-stable-before && sha256sum *) > /tmp/openalice-stable-before.sha256

      - name: Mirror release assets to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE_CHANNEL: ${{ needs.release.outputs.channel }}
          RELEASE_OPERATION: ${{ needs.release.outputs.operation }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            FEED_PREFIX="latest"
          else
            FEED_PREFIX="beta"
          fi

          aws s3 cp dist/r2-upload "s3://${R2_BUCKET}/" \
            --recursive \
            --exclude "*.yml" \
            --exclude "manifest.json" \
            --exclude "beta/*" \
            --exclude "install" \
            --exclude "OpenAlice-*-install" \
            --exclude "OpenAlice-*-install.sha256" \
            --exclude "mac-arm64.dmg" \
            --exclude "mac-arm64.zip" \
            --exclude "mac-x64.dmg" \
            --exclude "mac-x64.zip" \
            --exclude "windows-x64.exe" \
            --cache-control "public, max-age=31536000, immutable" \
            --endpoint-url "$ENDPOINT"

          aws s3 cp dist/r2-upload "s3://${R2_BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "${FEED_PREFIX}*.yml" \
            --cache-control "no-cache" \
            --content-type "text/yaml" \
            --endpoint-url "$ENDPOINT"

          for installer in \
            dist/r2-upload/OpenAlice-*-install \
            dist/r2-upload/OpenAlice-*-install.sha256; do
            [ -f "$installer" ] || continue
            key=$(basename "$installer")
            existing="/tmp/${key}.existing"
            if aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
              --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
              aws s3 cp "s3://${R2_BUCKET}/${key}" "$existing" --endpoint-url "$ENDPOINT"
              cmp "$installer" "$existing"
            else
              aws s3 cp "$installer" "s3://${R2_BUCKET}/${key}" \
                --cache-control "public, max-age=31536000, immutable" \
                --content-type "text/plain" \
                --endpoint-url "$ENDPOINT"
            fi
          done

          if [ "$RELEASE_OPERATION" = "release" ]; then
            aws s3 cp dist/r2-upload/install "s3://${R2_BUCKET}/install" \
              --cache-control "no-cache" \
              --content-type "text/plain" \
              --endpoint-url "$ENDPOINT"
          fi

          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            aws s3 cp dist/r2-upload/beta/manifest.json "s3://${R2_BUCKET}/beta/manifest.json" \
              --cache-control "no-cache" \
              --content-type "application/json" \
              --endpoint-url "$ENDPOINT"
          else
            aws s3 cp dist/r2-upload/manifest.json "s3://${R2_BUCKET}/manifest.json" \
              --cache-control "no-cache" \
              --content-type "application/json" \
              --endpoint-url "$ENDPOINT"
          fi

          if [ "$RELEASE_CHANNEL" = "stable" ] && [ -f dist/r2-upload/mac-arm64.dmg ]; then
            aws s3 cp dist/r2-upload/mac-arm64.dmg "s3://${R2_BUCKET}/mac-arm64.dmg" \
              --cache-control "no-cache" \
              --content-type "application/x-apple-diskimage" \
              --endpoint-url "$ENDPOINT"
          fi

          if [ "$RELEASE_CHANNEL" = "stable" ] && [ -f dist/r2-upload/mac-arm64.zip ]; then
            aws s3 cp dist/r2-upload/mac-arm64.zip "s3://${R2_BUCKET}/mac-arm64.zip" \
              --cache-control "no-cache" \
              --content-type "application/zip" \
              --endpoint-url "$ENDPOINT"
          fi

          if [ "$RELEASE_CHANNEL" = "stable" ] && [ -f dist/r2-upload/mac-x64.dmg ]; then
            aws s3 cp dist/r2-upload/mac-x64.dmg "s3://${R2_BUCKET}/mac-x64.dmg" \
              --cache-control "no-cache" \
              --content-type "application/x-apple-diskimage" \
              --endpoint-url "$ENDPOINT"
          fi

          if [ "$RELEASE_CHANNEL" = "stable" ] && [ -f dist/r2-upload/mac-x64.zip ]; then
            aws s3 cp dist/r2-upload/mac-x64.zip "s3://${R2_BUCKET}/mac-x64.zip" \
              --cache-control "no-cache" \
              --content-type "application/zip" \
              --endpoint-url "$ENDPOINT"
          fi

          if [ "$RELEASE_CHANNEL" = "stable" ] && [ -f dist/r2-upload/windows-x64.exe ]; then
            aws s3 cp dist/r2-upload/windows-x64.exe "s3://${R2_BUCKET}/windows-x64.exe" \
              --cache-control "no-cache" \
              --content-type "application/vnd.microsoft.portable-executable" \
              --endpoint-url "$ENDPOINT"
          fi

      - name: Verify CDN metadata
        env:
          DOWNLOAD_BASE_URL: ${{ secrets.DOWNLOAD_BASE_URL }}
          PUBLIC_INSTALL_URL: https://openalice.ai/install
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.release.outputs.channel }}
          RELEASE_OPERATION: ${{ needs.release.outputs.operation }}
        run: |
          set -euo pipefail
          BASE_URL="${DOWNLOAD_BASE_URL:-https://download.openalice.ai}"
          BASE_URL="${BASE_URL%/}"
          VERSION="${TAG#v}"
          shopt -s nullglob

          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            CHANNEL="latest"
            MAC_METADATA="latest-mac.yml"
            WINDOWS_METADATA="latest.yml"
            MANIFEST_PATH="manifest.json"
          else
            CHANNEL="beta"
            MAC_METADATA="beta-mac.yml"
            WINDOWS_METADATA="beta.yml"
            MANIFEST_PATH="beta/manifest.json"
          fi
          INSTALL_PATH="install"

          curl -fsSI "${BASE_URL}/${MAC_METADATA}"
          curl -fsSI "${BASE_URL}/${WINDOWS_METADATA}"
          curl -fsSI "${BASE_URL}/OpenAlice-${VERSION}-arm64.dmg"
          if [ -f "dist/r2-upload/${CHANNEL}-mac-intel.yml" ]; then
            curl -fsSI "${BASE_URL}/${CHANNEL}-mac-intel.yml"
          fi
          curl -fsSI "${BASE_URL}/OpenAlice-${VERSION}-install"
          curl -fsSI "${BASE_URL}/${MANIFEST_PATH}"
          curl -fsSI "${BASE_URL}/${INSTALL_PATH}"
          curl -fsSL "${BASE_URL}/OpenAlice-${VERSION}-install" -o /tmp/openalice-versioned-install
          cmp /tmp/openalice-versioned-install "dist/r2-upload/OpenAlice-${VERSION}-install"
          bash -n /tmp/openalice-versioned-install
          bash /tmp/openalice-versioned-install \
            --channel "$RELEASE_CHANNEL" \
            --version "$VERSION" \
            --plan | tee /tmp/openalice-install-plan
          grep -Fq "Channel         release (${VERSION})" /tmp/openalice-install-plan
          grep -Fq "Artifact        https://github.com/TraderAlice/OpenAlice/releases/download/${TAG}/openalice-cli-${VERSION}-linux-x64.tar.gz" /tmp/openalice-install-plan
          INSTALLER_PATH=/tmp/openalice-versioned-install MANIFEST_URL="${BASE_URL}/${MANIFEST_PATH}" INSTALL_URL="${BASE_URL}/install" RELEASE_CHANNEL="$RELEASE_CHANNEL" node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const manifest = JSON.parse(require("node:child_process").execFileSync("curl", ["-fsSL", process.env.MANIFEST_URL], { encoding: "utf8" }));
            const digest = createHash("sha256").update(readFileSync(process.env.INSTALLER_PATH)).digest("hex");
            if (manifest.installer?.url !== process.env.INSTALL_URL) process.exit(1);
            if (manifest.installer?.sha256 !== digest) process.exit(1);
            if (manifest.channel !== process.env.RELEASE_CHANNEL) process.exit(1);
          '

          if [ "$RELEASE_OPERATION" = "release" ]; then
            curl -fsSL "${BASE_URL}/${INSTALL_PATH}" -o /tmp/openalice-channel-install
            cmp /tmp/openalice-versioned-install /tmp/openalice-channel-install
            bash /tmp/openalice-channel-install --plan | tee /tmp/openalice-default-install-plan
            grep -Fq "Channel         stable (latest)" /tmp/openalice-default-install-plan
          fi

          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            curl -fsSI "${BASE_URL}/mac-arm64.dmg"
            if [ -f dist/r2-upload/mac-x64.dmg ]; then
              curl -fsSI "${BASE_URL}/mac-x64.dmg"
            fi
            if [ -f dist/r2-upload/mac-x64.zip ]; then
              curl -fsSI "${BASE_URL}/mac-x64.zip"
            fi
            curl -fsSI "${BASE_URL}/windows-x64.exe"
          else
            mkdir -p /tmp/openalice-stable-after
            for name in manifest.json latest-mac.yml latest-mac-arm64.yml latest-mac-intel.yml latest-intel-mac.yml latest.yml; do
              curl -fsSL "${BASE_URL}/${name}" -o "/tmp/openalice-stable-after/${name//\//_}"
            done
            (cd /tmp/openalice-stable-after && sha256sum *) > /tmp/openalice-stable-after.sha256
            cmp /tmp/openalice-stable-before.sha256 /tmp/openalice-stable-after.sha256
          fi

          if [ "$RELEASE_OPERATION" = "release" ]; then
            curl -fsSL "$PUBLIC_INSTALL_URL" -o /tmp/openalice-site-install
            cmp /tmp/openalice-channel-install /tmp/openalice-site-install
          fi

          cli_asset_count=0
          for archive in dist/r2-upload/openalice-cli-${VERSION}-*.tar.gz; do
            cli_asset_count=$((cli_asset_count + 1))
            checksum="${archive}.sha256"
            test -f "$checksum"
            expected=$(awk 'NR == 1 { print $1 }' "$checksum")
            actual=$(sha256sum "$archive" | awk '{ print $1 }')
            test "$actual" = "$expected"
            curl -fsSI "${BASE_URL}/$(basename "$archive")"
            curl -fsSI "${BASE_URL}/$(basename "$checksum")"
          done
          test "$cli_asset_count" = 4

          for catalog in dist/r2-upload/OpenAlice-Broker-Packs-${VERSION}-*.json; do
            curl -fsSI "${BASE_URL}/$(basename "$catalog")"
            CATALOG="$catalog" node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync(process.env.CATALOG,'utf8'));for(const p of c.packs)console.log(p.file)" |
              while IFS= read -r pack; do curl -fsSI "${BASE_URL}/${pack}"; done
          done

          WINDOWS_FEED_EXE=$(
            WINDOWS_METADATA="$WINDOWS_METADATA" node -e "const fs=require('fs');const content=fs.readFileSync('dist/r2-upload/'+process.env.WINDOWS_METADATA,'utf8');const match=content.match(/(?:^|\\n)path:\\s*['\"]?([^'\"\\n]+)['\"]?/);process.stdout.write(match?.[1]?.trim()||'')"
          )

          if [ -n "$WINDOWS_FEED_EXE" ]; then
            WINDOWS_FEED_URL=$(
              WINDOWS_FEED_EXE="$WINDOWS_FEED_EXE" node -e "process.stdout.write(encodeURI(process.env.WINDOWS_FEED_EXE))"
            )
            curl -fsSI "${BASE_URL}/${WINDOWS_FEED_URL}"
            curl -fsSI "${BASE_URL}/${WINDOWS_FEED_URL}.blockmap"
          fi
