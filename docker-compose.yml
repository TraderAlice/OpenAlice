# Compose for OpenAlice self-hosting.
#
# First time:
#   docker compose up -d --build
#   docker exec -it openalice claude        # OAuth — paste URL into a browser
#   docker exec -it openalice codex login   # same for codex (if you use it)
#
# After that the volume holds your auth + workspaces + config across
# restarts and image rebuilds. Tear-down + factory reset:
#   docker compose down -v        # also nukes the volume
#
# Already have claude/codex auth on the host? Skip the docker exec step by
# uncommenting the bind-mount lines below.
#
# --- Fix history ---
# 1) "--dangerously-skip-permissions cannot be used with root/sudo
#    privileges": fixed by running as non-root UID 1000 (`user:`) plus a
#    one-shot chown of the /data volume via `openalice-init`.
# 2) "Auto-update failed: no write permission": once the container runs as
#    UID 1000, Claude Code can no longer write to the npm global install
#    dir it was installed into as root during the build. Rather than
#    chown that directory too (which just relocates the same conflict),
#    disable the auto-updater outright with DISABLE_AUTOUPDATER=1. Manual
#    `claude update` inside the container still works if you ever need it.
# 3) Studio not loading / blank page: `uv`/`uvx` only live in ~/.local/bin
#    inside the session, which isn't on PATH for every shell the harness
#    spawns. Fixed by explicitly prepending ~/.local/bin to PATH so any
#    child shell can find uv/uvx regardless of how it's invoked.

services:
  openalice-init:
    image: busybox:stable
    container_name: openalice-init
    # One-shot: make sure the named volume is owned by the non-root user
    # the main service runs as, then exit. Required because named volumes
    # are created and owned by root by default.
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - openalice-data:/data
    restart: "no"

  openalice:
    build: .
    image: openalice:local
    container_name: openalice
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      openalice-init:
        condition: service_completed_successfully
    # Run as non-root so Claude Code's root/sudo guard doesn't block
    # --dangerously-skip-permissions. Match this UID/GID to whatever user
    # your Dockerfile creates (defaults to 1000:1000 on most base images).
    user: "1000:1000"
    environment:
      # Fallback in case root/sudo is still detected despite running
      # non-root (some sandboxes/CI runners report UID 0 upstream).
      - IS_SANDBOX=1
  		- NOTION_API_KEY=${NOTION_API_KEY}
  		- NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      # Claude Code can no longer write to its own npm global install dir
      # once running non-root — stop it from trying instead of chowning
      # a root-owned system path.
      - DISABLE_AUTOUPDATER=1
      # Make sure uv/uvx (installed to ~/.local/bin) resolve for every
      # shell the harness spawns, not just the one that installed them.
      - PATH=/data/home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      # Web UI. The MCP server (47332) is intentionally NOT exposed — it's
      # only consumed by the CLIs running inside this container.
      - "47331"
    volumes:
      - openalice-data:/data
      # Optional: reuse host auth instead of authenticating inside the
      # container. Bind-mount your local credentials read-only.
      # - ${HOME}/.claude:/data/home/.claude:ro
      # - ${HOME}/.codex:/data/home/.codex:ro
    # Keep stdin/tty open so `docker exec -it openalice claude` can run
    # the interactive OAuth flow.
    stdin_open: true
    tty: true
    # Bound Docker's json-file growth on long-running remote hosts. Product
    # state remains in /data; these are only container stdout/stderr logs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openalice-data:
