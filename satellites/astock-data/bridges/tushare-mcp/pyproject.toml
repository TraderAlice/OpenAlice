[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tushare-mcp"
version = "0.1.0"
description = "OpenAlice satellite: Tushare Pro MCP bridge for A-share fundamentals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "mcp>=1.9.0,<2",
  "tushare>=1.4.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
tushare-mcp = "tushare_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tushare_mcp = ["py.typed"]
